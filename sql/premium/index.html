<body><div data-pp-include="/header.html" data-pp-slot="header"></div>
<div class="vs-titlebar">
<div class="title">Programmer’s Picnic SQL — Beginner</div>
<div style="display:flex;align-items:center;gap:10px">
<span class="brand-mark" aria-hidden="true">SQL</span>
<b>Programmer’s Picnic SQL</b>
</div>
<div class="title-actions">
<button id="themeToggleBtn">🌙 Dark</button>
<button id="shareBtn">Share All SQL</button>
<button id="fullscreenBtn">⛶ Full Screen</button>
</div>
</div>
<div style="padding: 10px">
<div class="row">
<button disabled id="runBtn">▶ Run SQL</button>
<button disabled id="resetBtn">⟳ Reset DB</button>
</div>
<div class="hint">
        Tip: Select part of the SQL to run only that portion. With no selection,
        the complete query runs. Press Ctrl/Command + Enter to run.
      </div>
<div class="panel">
<b>Import data</b>
<div class="row">
<input aria-label="Table name" id="tableNameInput" type="text" value="my_data"/>
<input accept=".csv,.json,text/csv,application/json" id="dataFileInput" type="file"/>
<button id="importCsvBtn">⬆ Import CSV</button>
<button id="importJsonBtn">⬆ Import JSON</button>
</div>
<div class="hint">
          After import, use: <code>SELECT * FROM my_data;</code>
</div>
</div>
<div>
<button class="chip" data-sql="SELECT * FROM students;">
          Students
        </button>
<button class="chip" data-sql="SELECT COUNT(*) AS total_students FROM students;">
          COUNT
        </button>
<button class="chip" data-sql="SELECT * FROM my_data LIMIT 20;">
          Imported table
        </button>
</div>
<label class="editor-label" for="sqlInput">SQL query</label>
<textarea id="sqlInput" spellcheck="false">SELECT * FROM students;</textarea>
<div class="row" style="margin-top: 8px">
<button disabled="" id="exportCsvBtn">⬇ Export Result CSV</button>
<button disabled="" id="exportJsonBtn">⬇ Export Result JSON</button>
</div>
<div id="result" role="status" aria-live="polite">Loading SQLite…</div>
<section class="panel" aria-labelledby="historyTitle">
<b id="historyTitle">Saved query history</b>
<div class="history-tabs">
<button class="history-tab active" id="successfulTab" type="button">Successful (<span id="successfulCount">0</span>)</button>
<button class="history-tab" id="unsuccessfulTab" type="button">Unsuccessful (<span id="unsuccessfulCount">0</span>)</button>
<button id="clearShownHistoryBtn" type="button">Remove All Shown</button>
</div>
<div class="history-list" id="queryHistoryList"></div>
</section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js" crossorigin="anonymous"></script>
<script defer src="app.js"></script>
<div data-pp-include="/footer.html" data-pp-slot="footer"></div></body>
