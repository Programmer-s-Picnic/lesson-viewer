<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>C# Online Editor | Learn With Champak</title>
  <meta name="description" content="Write, run and learn C# in your browser with the Learn With Champak online C# editor. Includes stdin, examples, downloadable Program.cs and console output." />
  <meta name="keywords" content="C# online editor,C sharp compiler,C# tutorial,C# browser IDE,Learn With Champak,Champak Roy,programming editor" />
  <meta name="author" content="Learn With Champak" />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#111827" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="C# Online Editor | Learn With Champak" />
  <meta property="og:description" content="Write and run C# directly in your browser." />
  <meta property="og:image" content="og-csharp-editor.png" />
  <meta property="og:site_name" content="Learn With Champak" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="C# Online Editor | Learn With Champak" />
  <meta name="twitter:description" content="Write and run C# directly in your browser." />
  <meta name="twitter:image" content="og-csharp-editor.png" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">C#</div>
      <div>
        <div class="brand-name">Learn With Champak</div>
        <h1>C# Online Editor</h1>
      </div>
    </div>

    <div class="top-actions">
      <span id="backendBadge" class="badge" title="Execution backend">Backend: ready</span>
      <button id="fullscreenBtn" class="btn ghost" type="button">Fullscreen</button>
    </div>
  </header>

  <main class="app-shell">
    <section class="toolbar" aria-label="Editor controls">
      <div class="toolbar-group">
        <label class="select-label" for="exampleSelect">Example</label>
        <select id="exampleSelect" class="select">
          <option value="hello">Hello World</option>
          <option value="input">Input / Output</option>
          <option value="conditions">Conditions</option>
          <option value="loops">Loops</option>
          <option value="functions">Functions</option>
          <option value="dateclass">OOP: Date example</option>
          <option value="currencyclass">OOP: Currency example</option>
        </select>
        <button id="loadExampleBtn" class="btn ghost" type="button">Load</button>
      </div>

      <div class="toolbar-group">
        <button id="runBtn" class="btn primary" type="button">Run ▶</button>
        <button id="stopBtn" class="btn danger" type="button" disabled>Stop</button>
        <button id="resetBtn" class="btn ghost" type="button">Reset</button>
        <button id="copyBtn" class="btn ghost" type="button">Copy</button>
        <button id="downloadBtn" class="btn ghost" type="button">Download Program.cs</button>
      </div>
    </section>

    <section class="workspace">
      <div class="panel editor-panel">
        <div class="panel-title">
          <span>Program.cs</span>
          <span id="saveStatus" class="muted">Autosaved</span>
        </div>
        <div class="editor-wrap">
          <pre id="lineNumbers" class="line-numbers" aria-hidden="true">1</pre>
          <textarea id="codeEditor" class="code-editor" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="C# source code"></textarea>
        </div>
      </div>

      <div class="right-column">
        <div class="panel stdin-panel">
          <div class="panel-title">
            <span>Standard Input</span>
            <button id="clearInputBtn" class="mini-btn" type="button">Clear</button>
          </div>
          <textarea id="stdin" class="stdin" spellcheck="false" placeholder="Input for Console.ReadLine(), one value per line"></textarea>
        </div>

        <div class="panel output-panel">
          <div class="panel-title">
            <span>Output</span>
            <div class="panel-actions">
              <span id="runStatus" class="muted">Ready</span>
              <button id="clearOutputBtn" class="mini-btn" type="button">Clear</button>
            </div>
          </div>
          <pre id="output" class="output" aria-live="polite">Press Run or Ctrl+Enter.</pre>
        </div>
      </div>
    </section>

    <section class="helpbar">
      <span><strong>Run:</strong> Ctrl+Enter</span>
      <span><strong>Indent:</strong> Tab</span>
      <span><strong>Save:</strong> automatic in this browser</span>
      <span><strong>Hosting:</strong> GitHub Pages compatible</span>
    </section>
  </main>

  <footer class="footer">
    Learn With Champak · C# practice editor
  </footer>

  <script src="app.js"></script>
</body>
</html>
