<body><div data-pp-include="/header.html" data-pp-slot="header"></div>
<div class="container">
<div class="card">
<h1>Programmer’s Picnic 🍊 Image Generator</h1>
<p class="sub">Localhost demo — Blogger-ready frontend</p>
<label>Prompt</label>
<textarea id="prompt" placeholder="Example: Indian teacher explaining recursion inside laptop, comic style, soft saffron theme">

Example: Indian teacher explaining recursion inside laptop, comic style, soft saffron theme

    </textarea>
<label>Style Preset</label>
<select id="style">
<option value="">None</option>
<option value="comic style, clean outlines, soft saffron palette">
          Comic Explainer
        </option>
<option value="youtube thumbnail style, bold, high contrast">
          YouTube Thumbnail
        </option>
<option value="educational diagram, minimal, clean layout">
          Diagram
        </option>
</select>
<!-- IMPORTANT: type="button" prevents form submission -->
<button id="genBtn" type="button">Generate ✨</button>
<div class="status" id="status">Ready.</div>
<div class="output" id="output">
<div class="small">Generated image will appear here</div>
</div>
</div>
</div>
<script>
    const API_URL = "http://127.0.0.1:9000/pp-generate";

    const btn = document.getElementById("genBtn");
    const statusEl = document.getElementById("status");
    const output = document.getElementById("output");

    btn.addEventListener("click", generateImage);

    async function generateImage() {
      const prompt = document.getElementById("prompt").value.trim();
      const style = document.getElementById("style").value;

      if (!prompt) {
        statusEl.textContent = "Please enter a prompt.";
        return;
      }

      btn.disabled = true;
      statusEl.textContent = "Generating… please wait";
      output.innerHTML = "<div class='small'>Working…</div>";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: prompt,
            style: style,
            key: "PP_SECRET_2025"
          })
        });

        if (!res.ok) {
          throw new Error("Server error: " + res.status);
        }

        const blob = await res.blob();
        const imgURL = URL.createObjectURL(blob);

        const img = new Image();
        img.onload = () => URL.revokeObjectURL(imgURL);
        img.src = imgURL;

        output.innerHTML = "";
        output.appendChild(img);

        statusEl.textContent = "Done ✅";
      }
      catch (err) {
        console.error(err);
        statusEl.textContent = "Failed ❌ Check proxy server.";
        output.innerHTML = "<div class='small'>Could not generate image</div>";
      }
      finally {
        btn.disabled = false;
      }
    }
  </script>
