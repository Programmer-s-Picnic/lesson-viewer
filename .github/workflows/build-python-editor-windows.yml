name: Build Python Editor Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-installer/**"
      - "python-starter/editor/super/**"
      - ".github/workflows/build-python-editor-windows.yml"

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PythonEditor-Windows-Installer
          path: windows-installer/dist/*.exe
          if-no-files-found: error
      - name: Publish permanent installer release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: python-editor-v1.0.0
          name: Python Editor for Windows v1.0.0
          body: |
            Windows installer for the Learn With Champak Python Editor.

            Includes the video-only Reel recorder and offline preparation support.
          files: windows-installer/dist/PythonEditorSetup-1.0.0.exe
          fail_on_unmatched_files: true
