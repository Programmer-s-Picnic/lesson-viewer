name: Build Python Editor Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - "windows-installer/**"
      - "python-starter/editor/super/**"
      - ".github/workflows/build-python-editor-windows.yml"

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows-installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build installer
        run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PythonEditor-Windows-Installer
          path: windows-installer/dist/*.exe
          if-no-files-found: error
