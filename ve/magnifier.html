<body>
<div class="supercontainer">
<div class="container">
<img alt="0" class="simpleimage" onmousemove="getPicture(event)" src="pics/0.jpg"/>
<img alt="1" class="simpleimage" onmousemove="getPicture(event)" src="pics/1.jpg"/>
</div>
<div class="container" style="position: relative !important;">
<div class="cover">hoohhhhhhhhh</div><img alt="0" class="magnifiedimage" id="magnifiedimg" src="pics/0.jpg"/>
</div>
</div>
<script>
        const magnifiedimg = document.getElementById("magnifiedimg");
        function getPicture(evt) {
            // console.log(evt.target.src);
            const x = evt.clientX;
            const y = evt.clientY;
            console.log(x, y);
            magnifiedimg.src = evt.target.src;
            magnifiedimg.style.left=`${300}.px`;
            magnifiedimg.style.top=`${y}.px`;
        }
    </script>
