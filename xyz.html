<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Embedded YouTube Video</title>
<meta content="A simple HTML page with an embedded YouTube video." name="description"/>
<style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #f8fafc;
        --muted: #cbd5e1;
        --accent: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .wrap {
        width: min(100%, 960px);
        background: rgba(17, 24, 39, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.6rem, 3vw, 2.4rem);
        color: var(--accent);
        text-align: center;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
        text-align: center;
        line-height: 1.6;
      }

      .video-box {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        border-radius: 16px;
        background: #000;
      }

      .video-box iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
<meta charset="UTF-8"/><meta content="Champak Roy" name="author"/><link href="https://editor.learnwithchampak.live/xyz.html" rel="canonical"/><meta content="website" property="og:type"/><meta content="Embedded YouTube Video" property="og:title"/><meta content="A simple HTML page with an embedded YouTube video." property="og:description"/><meta content="https://editor.learnwithchampak.live/xyz.html" property="og:url"/><meta content="https://editor.learnwithchampak.live/assets/og/default-og.png" property="og:image"/><meta content="summary_large_image" name="twitter:card"/><meta content="Embedded YouTube Video" name="twitter:title"/><meta content="A simple HTML page with an embedded YouTube video." name="twitter:description"/><meta content="https://editor.learnwithchampak.live/assets/og/default-og.png" name="twitter:image"/><script defer="True" src="/assets/js/pp-includes.js"></script></head>
<body><div data-pp-include="/header.html" data-pp-slot="header"></div>
<div class="wrap">
<h1>Embedded YouTube Video</h1>
<p>Responsive HTML page with your YouTube video embedded.</p>
<div class="video-box">
<iframe allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          " allowfullscreen="" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube.com/embed/IHvQXgVN8Vc?si=Ea3ESoum4fw8vD60" title="YouTube video player">
</iframe>
</div>
</div>
<div data-pp-include="/footer.html" data-pp-slot="footer"></div></body>
</html>
