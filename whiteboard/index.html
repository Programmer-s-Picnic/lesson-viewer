<body><div data-pp-include="/header.html" data-pp-slot="header"></div>
<div class="app">
<header class="topbar">
<div class="brand">Programmer's Picnic — Whiteboard Engine</div>
<div class="top-actions">
<button id="themeBtn">Toggle Theme</button>
<button id="newBtn">New</button>
<button id="saveBtn">Export JSON</button>
<button id="loadBtn">Load JSON</button>
<button id="pngBtn">Export PNG</button>
<button id="shareHashBtn">Share Hash</button>
<button id="shareQueryBtn">Copy ?json Link</button>
<input accept="application/json" hidden="" id="fileInput" type="file"/>
</div>
<button class="btn" id="fullscreenBtn">Fullscreen</button>
</header>
<section class="toolbar">
<button class="active" data-tool="select">Select</button>
<button data-tool="rect">Rect</button>
<button data-tool="ellipse">Ellipse</button>
<button data-tool="diamond">Diamond</button>
<button data-tool="line">Line</button>
<button data-tool="arrow">Arrow</button>
<button data-tool="text">Text</button>
<label class="color-label">Stroke <input id="strokeColor" type="color" value="#1f2328"/></label>
<label class="color-label">Fill <input id="fillColor" type="color" value="#fff1c7"/></label>
<label class="range-label">Stroke
          <input id="strokeWidth" max="12" min="1" step="1" type="range" value="2"/><span id="strokeWidthValue">2</span></label>
<label class="select-label">Font
          <select id="fontFamily">
<option value="Inter, sans-serif">Inter</option>
<option value="Arial, sans-serif">Arial</option>
<option value="Georgia, serif">Georgia</option>
<option value="Courier New, monospace">Courier New</option>
<option value="Verdana, sans-serif">Verdana</option>
</select></label>
<label class="range-label">Size
          <input id="fontSize" max="48" min="10" step="1" type="range" value="18"/><span id="fontSizeValue">18</span></label>
<button id="groupBtn">Group</button>
<button id="ungroupBtn">Ungroup</button>
<button id="undoBtn">Undo</button>
<button id="redoBtn">Redo</button>
<button id="selectAllBtn">Select All</button>
<div class="status" id="statusText">Ready</div>
</section>
<main class="board-shell">
<aside class="props-panel" id="propsPanel">
<div class="props-title">Selected Object</div>
<label class="prop-row">Stroke <input id="propStroke" type="color" value="#1f2328"/></label>
<label class="prop-row">Fill <input id="propFill" type="color" value="#fff1c7"/></label>
<label class="prop-row">Width <input id="propWidth" min="1" step="1" type="number"/></label>
<label class="prop-row">Height <input id="propHeight" min="1" step="1" type="number"/></label>
<label class="prop-row">Stroke Width
            <input id="propStrokeWidth" max="12" min="1" step="1" type="range" value="2"/></label>
<label class="prop-row">Font Family
            <select id="propFontFamily">
<option value="Inter, sans-serif">Inter</option>
<option value="Arial, sans-serif">Arial</option>
<option value="Georgia, serif">Georgia</option>
<option value="Courier New, monospace">Courier New</option>
<option value="Verdana, sans-serif">Verdana</option>
</select></label>
<label class="prop-row">Font Size
            <input id="propFontSize" max="48" min="10" step="1" type="range" value="18"/></label>
<label class="prop-row">Text
            <textarea id="propText" placeholder="Edit selected text" rows="4"></textarea>
</label>
</aside>
<canvas id="board"></canvas>
<div class="hint">
          Shift+click adds selection · Drag empty space for marquee · Delete
          removes selection · Cursor changes by tool
        </div>
</main>
</div>
<script src="./app.js" type="module"></script>
<div data-pp-include="/footer.html" data-pp-slot="footer"></div></body>
</html>
